<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>笔记详情 - 笔记工坊</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f5f5f5; }

        .header { background: #4a90d9; color: white; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; font-size: 20px; }
        .header a { color: white; text-decoration: none; margin-left: 12px; }

        .box { max-width: 760px; margin: 24px auto; background: #fff;
            padding: 28px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

        .title { font-size: 24px; margin: 0 0 12px; color: #222; }
        .meta { color: #999; font-size: 13px; margin-bottom: 20px;
            padding-bottom: 16px; border-bottom: 1px solid #eee; }
        .meta span { margin-right: 18px; }

        .content { font-size: 15px; line-height: 1.9; color: #333;
            white-space: pre-wrap; word-break: break-word; min-height: 80px; }

        .actions { display: flex; gap: 12px; margin-top: 28px; padding-top: 20px;
            border-top: 1px solid #eee; }
        .actions button, .actions a {
            padding: 9px 22px; border: none; border-radius: 6px;
            font-size: 14px; cursor: pointer; text-decoration: none;
            display: inline-block; font-family: inherit; }
        .edit { background: #4a90d9; color: #fff; }
        .edit:hover { background: #3a7bc8; }
        .del { background: #ffe5e5; color: #e74c3c; }
        .del:hover { background: #ffd0d0; }
        .back { background: #eee; color: #555; }
        .back:hover { background: #e0e0e0; }

        .empty { text-align: center; color: #999; padding: 60px 0; font-size: 15px; }

        /* 点赞条 */
        .like-bar { margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee; }
        .like-btn { cursor: pointer; color: #999; font-size: 14px; user-select: none;
            display: inline-block; padding: 4px 12px; border-radius: 4px; }
        .like-btn:hover { color: #e74c3c; background: #fff5f5; }
        .like-btn.liked { color: #e74c3c; }
        /* ===== 评论区 ===== */
        .c-item { padding: 12px 0; border-bottom: 1px solid #f2f2f2; }
        .c-name { color: #4a90d9; font-size: 13px; font-weight: bold; }
        .c-text { margin: 4px 0 0; font-size: 14px; line-height: 1.7;
            white-space: pre-wrap; word-break: break-word; }
        .c-reply { margin: 8px 0 0 24px; padding: 6px 0 0 12px;
            border-left: 2px solid #eee; font-size: 13px; color: #555; }
        .c-reply .c-name { color: #999; font-weight: normal; }
        #cInput { width: 100%; min-height: 70px; padding: 10px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 14px; box-sizing: border-box;
            resize: vertical; font-family: inherit; outline: none; }
        #cInput:focus { border-color: #4a90d9; }
    </style>
</head>
<body>

<div class="header">
    <h2>📓 笔记工坊</h2>
    <div><a href="/">← 返回大厅</a></div>
</div>

<div class="box" id="box">
    <div class="empty">加载中...</div>
</div>
<!-- ===== 评论区（单独一个盒子，在笔记下面） ===== -->
<div class="box" id="cBox">
    <h3 style="margin:0 0 14px;font-size:17px;">💬 评论 (<span id="cCount">0</span>)</h3>

    <div id="cList"></div>

    <div style="margin-top:20px;padding-top:16px;border-top:1px solid #eee;">
        <textarea id="cInput" placeholder="说点什么..."></textarea>
        <button onclick="sendComment()"
                style="margin-top:10px;padding:9px 22px;background:#4a90d9;color:#fff;
                       border:none;border-radius:6px;font-size:14px;cursor:pointer;">
            发表评论
        </button>
    </div>
</div>

<script src="/common.js"></script>

<script>
    // ============================================================
    // ① 从 URL 里取出 id
    //    页面地址是 /detail.html?id=1
    //    location.search = "?id=1"
    // ============================================================
    const params = new URLSearchParams(location.search);
    const noteId = params.get('id');       // "1"  ← 注意是字符串

    const box = document.getElementById('box');

    // ============================================================
    // ② 加载详情
    // ============================================================
    async function load() {
        if (!noteId) {
            box.innerHTML = '<div class="empty">缺少笔记 id</div>';
            return;
        }

        let note;
        try {
            // api() 是 common.js 里的函数，自动解析 JSON
            note = await api('/note/detail/' + noteId);
        } catch (e) {
            box.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>';
            return;
        }

        if (!note) {
            box.innerHTML = '<div class="empty">笔记不存在或已被删除</div>';
            return;
        }

        // ============================================================
        // ③ 判断"这条笔记是不是我写的"
        //    当前登录用户（可能是 null）
        //    note.userId 是作者 id
        // ============================================================
        const me = getLoginUser();
        const isMine = me && note.userId === me.id;

        // 时间格式化：2026-10-23T09:48:11 → 2026-10-23 09:48
        const fmt = t => t ? t.replace('T', ' ').slice(0, 16) : '';

        // ============================================================
        // ④ 渲染
        // ============================================================
        box.innerHTML = `
            <h1 class="title">${note.title}</h1>
            <div class="meta">
                <span>📖 ${note.bookName || '（未填写图书）'}</span>
                <span>👤 作者 id：${note.userId}</span>
                <span>🕒 创建：${fmt(note.createTime)}</span>
                <span>🔄 更新：${fmt(note.updateTime)}</span>
                <span>${note.isPublic === 1 ? '🌐 公开' : '🔒 私有'}</span>
            </div>
            <div class="content">${note.content || '（没有内容）'}</div>

            <!-- 点赞条 -->
            <div class="like-bar">
                <span class="like-btn" onclick="toggleLike(${note.id}, this)">
                    👍 <span class="like-cnt">${note.likeCount || 0}</span> 人觉得有用
                </span>
            </div>

            <div class="actions">
                ${isMine ? `
                    <a class="edit" href="/edit.html?id=${note.id}">✏️ 编辑</a>
                    <button class="del" onclick="delNote(${note.id})">🗑 删除</button>
                ` : ''}
                <button class="back" onclick="location.href='/'">← 返回</button>
            </div>
        `;

        // 如果没登录，给个提示
        if (!me) {
            box.querySelector('.actions').insertAdjacentHTML('beforeend',
                '<span style="font-size:13px;color:#999;align-self:center;">' +
                '（登录后如果是自己的笔记，可以编辑/删除）</span>');
        }
    }

    // ============================================================
    // ⑤ 删除
    // ============================================================
    async function delNote(id) {
        // confirm 返回 true/false
        if (!confirm('确定要删除这条笔记吗？\n（删除后不会出现在列表里）')) {
            return;
        }

        try {
            // DELETE 请求，参数放在 URL 的 ?id= 后面
            await api('/note/delete?id=' + id, { method: 'DELETE' });
            alert('已删除');
            location.href = '/';
        } catch (e) {
            alert('删除失败：' + e.message);
        }
    }
    // ============================================================
    // ⑥ 评论区
    // ============================================================

    // 【核心】找一条评论最终挂到哪个"顶级评论"下
    //   因为你的数据有三级：#1(顶级) → #2(回复#1) → #3(回复#2)
    //   #3 的 parentId 是 2，不是 0，所以不能直接按 parentId 分组
    //   这个函数一路往上追，追到 parentId === 0 为止
    function findRootId(c, all) {
        let cur = c;
        while (cur.parentId !== 0) {
            const parent = all.find(x => x.id === cur.parentId);
            if (!parent) return 0;      // 找不到父级（可能被删了），当顶级处理
            cur = parent;
        }
        return cur.id;                   // 返回顶级评论的 id
    }

    // 加载评论
    async function loadComments() {
        let all;
        try {
            all = await api('/comment/list?noteId=' + noteId);
        } catch (e) {
            document.getElementById('cList').innerHTML =
                '<p style="color:#999;font-size:14px;">评论加载失败</p>';
            return;
        }

        document.getElementById('cCount').textContent = all.length;

        if (!all || all.length === 0) {
            document.getElementById('cList').innerHTML =
                '<p style="color:#999;font-size:14px;">还没有评论，来说第一句吧</p>';
            return;
        }

        // 顶级评论（parentId === 0）
        const roots = all.filter(c => c.parentId === 0);

        document.getElementById('cList').innerHTML = roots.map(root => {
            // 所有"根是这条"的评论 = 它的所有子孙（不管几级）
            const children = all.filter(c =>
                c.id !== root.id && findRootId(c, all) === root.id
            );

            return `
                <div class="c-item">
                    <span class="c-name">${root.userName || '匿名'}</span>
                    <p class="c-text">${root.content}</p>
                    ${children.map(ch => `
                        <div class="c-reply">
                            <span class="c-name">${ch.userName || '匿名'}</span>：${ch.content}
                        </div>
                    `).join('')}
                </div>
            `;
        }).join('');
    }

    // 发评论
    async function sendComment() {
        const me = requireLogin();       // 没登录会跳登录页
        if (!me) return;

        const input = document.getElementById('cInput');
        const text = input.value.trim();

        if (!text) {
            alert('评论不能为空');
            input.focus();
            return;
        }

        try {
            await apiJson('/comment/add', 'POST', {
                noteId: Number(noteId),   // 当前这篇笔记
                userId: me.id,            // 当前登录用户
                parentId: 0,              // 0 = 顶级评论
                content: text
            });

            input.value = '';             // 清空输入框
            loadComments();               // 重新加载列表

        } catch (e) {
            alert('评论失败，请稍后重试');
            console.error(e);
        }
    }

    loadComments();     // 页面打开就加载评论
    // ==================== 点赞 / 取消 ====================
    async function toggleLike(noteId, el) {
        if (!getLoginUser()) {
            alert('请先登录');
            location.href = '/login.html';
            return;
        }

        try {
            const res = await apiJson('/like/toggle?noteId=' + noteId, 'POST', {});
            const cntEl = el.querySelector('.like-cnt');
            const cur = parseInt(cntEl.textContent) || 0;

            if (res.liked) {
                cntEl.textContent = cur + 1;
                el.classList.add('liked');
            } else {
                cntEl.textContent = Math.max(0, cur - 1);
                el.classList.remove('liked');
            }
        } catch (e) {
            alert('操作失败：' + e.message);
        }
    }

    load();
</script>

</body>
</html>
