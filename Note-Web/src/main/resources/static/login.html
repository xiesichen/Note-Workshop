
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center;
            justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
        .box { background: #fff; padding: 30px; border-radius: 8px; width: 300px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1); }
        h3 { margin: 0 0 20px; text-align: center; }
        input { width: 100%; padding: 9px; margin: 6px 0; box-sizing: border-box;
            border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #4a90d9; color: #fff;
            border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        #msg { color: #e74c3c; font-size: 14px; margin-top: 12px; min-height: 20px;
            text-align: center; }
        .back { text-align: center; margin-top: 16px; }
        .back a { color: #999; font-size: 13px; text-decoration: none; }
    </style>
</head>
<body>
<div class="box">
    <h3>📓 笔记工坊</h3>
    <input id="u" placeholder="账号">
    <input id="p" type="password" placeholder="密码">
    <button onclick="login()">登 录</button>
    <div id="msg"></div>
    <div class="back">
        <a href="/register.html">没有账号？去注册 →</a><br>
        <a href="/" style="display:inline-block;margin-top:8px;">← 返回大厅</a>
    </div>
</div>

<!-- ★ 新增①：引入 common.js，才能用 setLoginUser() -->
<script src="/common.js"></script>

<script>
    function login() {
        const username = document.getElementById('u').value.trim();
        const password = document.getElementById('p').value;

        // 前端简单校验
        if (!username || !password) {
            document.getElementById('msg').style.color = '#e74c3c';
            document.getElementById('msg').textContent = '账号和密码不能为空';
            return;
        }

        fetch('/user/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
            .then(res => {
                if (!res.ok) throw new Error('fail');
                return res.json();
            })
            .then(data => {
                // 后端返回：{ token: "eyJhbG...", user: {id, username, nickname, ...} }

                const user = data.user;      // ★ 注意取 data.user

                // 显示"登录成功：管理员"
                document.getElementById('msg').style.color = '#27ae60';
                document.getElementById('msg').textContent =
                    '登录成功：' + (user.nickname || user.username);

                // ★ 存 token（发请求要用）和用户信息（页面显示要用）
                setToken(data.token);
                setLoginUser(user);

                // 停 0.7 秒后跳回大厅
                setTimeout(function () { location.href = '/'; }, 700);
            })
            .catch(() => {
                document.getElementById('msg').style.color = '#e74c3c';
                document.getElementById('msg').textContent = '账号或密码错误';
            });
    }
</script>
</body>
</html>
