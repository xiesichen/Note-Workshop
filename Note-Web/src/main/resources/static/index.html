<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>笔记工坊</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
        .header { background: #4a90d9; color: white; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: 20px auto; }
        .card { background: white; border-radius: 8px; padding: 15px;
            margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,.08);
            cursor: pointer; transition: box-shadow .15s, transform .15s; }
        .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.14); transform: translateY(-1px); }
        .card h3 { margin: 0 0 8px; }
        .meta { color: #999; font-size: 13px; }

        /* 【新增】顶栏链接的样式 */
        .header a { color: white; text-decoration: none; margin-left: 16px; }
        .header #userArea span { margin-left: 16px; }

        /* 点赞条 */
        .like-bar { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f2f2f2; }
        .like-btn { cursor: pointer; color: #999; font-size: 14px; user-select: none;
            display: inline-block; padding: 2px 8px; border-radius: 4px; }
        .like-btn:hover { color: #e74c3c; background: #fff5f5; }
        .like-btn.liked { color: #e74c3c; }
        .header a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="header">
    <h2>📓 笔记工坊</h2>
    <div>
        <input id="search" placeholder="🔍 搜索" style="padding:6px 10px;border:none;border-radius:4px;width:160px;">
        <a href="/hot.html">🔥 热门榜</a>
        <a href="/my.html" id="myBtn" style="display:none;">📚 我的笔记</a>
        <a href="/add.html" id="writeBtn" style="display:none;">✏️ 写笔记</a>
        <span id="userArea"></span>
    </div>
</div>

<div class="container" id="list">
    <!-- 笔记列表由下面的 JS 填充 -->
</div>


<!-- 【改动2】引入 common.js（必须先引入，后面才能用 getLoginUser 等函数） -->
<script src="/common.js"></script>

<script>
    // ============================================================
    // 【改动3】新增：渲染顶栏的登录状态
    // ============================================================

    // ① 读出当前登录用户
    //    getLoginUser() 是 common.js 里的函数
    //    登录了 → 返回对象 {id:1, nickname:"管理员", ...}
    //    没登录 → 返回 null
    const loginUser = getLoginUser();

    // ② 找到顶栏右边那个 div
    const userArea = document.getElementById('userArea');

    // ③ 根据有没有登录，填不同的内容
    if (loginUser) {
        // ---- 已登录 ----
        userArea.innerHTML = `
            <span>欢迎，${loginUser.nickname || loginUser.username}</span>
            <a href="javascript:void(0)" onclick="logout()">退出</a>
        `;
        //  ${loginUser.nickname || loginUser.username}
        //      └───优先用昵称────┘    └─昵称没有就用账号─┘
        //
        //  onclick="logout()"  → 点"退出"时调用 common.js 里的 logout()
        document.getElementById('writeBtn').style.display = 'inline';
        document.getElementById('myBtn').style.display = 'inline';
        //  href="javascript:void(0)" → 让 <a> 不跳转（只是个按钮的样子）
    } else {
        // ---- 未登录 ----
        userArea.innerHTML = `<a href="/login.html">登录</a>`;
    }


    // ============================================================
    // 下面是你原来的代码：加载笔记列表（没动）
    // ============================================================
    // ===== 渲染函数：把一组笔记显示出来 =====
    function render(notes) {
        const list = document.getElementById('list');

        if (!notes || notes.length === 0) {
            list.innerHTML = '<p style="text-align:center;color:#999;padding:40px 0;">没有找到笔记</p>';
            return;
        }

        list.innerHTML = notes.map(n => `
            <div class="card" onclick="location.href='/detail.html?id=${n.id}'">
                <h3>${n.title}</h3>
                <div class="meta">📖 ${n.bookName || '（未填图书）'} · ${(n.createTime || '').replace('T',' ').slice(0,16)}</div>
                <p>${n.content || ''}</p>
                <div class="like-bar">
                    <span class="like-btn" onclick="event.stopPropagation(); toggleLike(${n.id}, this)">
                        👍 <span class="like-cnt">${n.likeCount || 0}</span>
                    </span>
                </div>
            </div>
        `).join('');
    }

    // ===== 点赞 / 取消点赞 =====
    async function toggleLike(noteId, el) {
        // 没登录先去登录
        if (!getLoginUser()) {
            alert('请先登录');
            location.href = '/login.html';
            return;
        }

        try {
            // apiJson 自动带 token
            const res = await apiJson('/like/toggle?noteId=' + noteId, 'POST', {});

            const cntEl = el.querySelector('.like-cnt');
            const cur = parseInt(cntEl.textContent) || 0;

            if (res.liked) {
                cntEl.textContent = cur + 1;
                el.classList.add('liked');       // 变红
            } else {
                cntEl.textContent = Math.max(0, cur - 1);
                el.classList.remove('liked');
            }
        } catch (e) {
            alert('操作失败：' + e.message);
        }
    }

    // ===== 首次加载全部笔记 =====
    api('/note/list').then(render);
    // ===== 搜索框：停止输入 300ms 后请求后端 =====
    let searchTimer;

    document.getElementById('search').addEventListener('input', function () {
        clearTimeout(searchTimer);

        searchTimer = setTimeout(async () => {
            const kw = this.value.trim();

            // 有关键字 → 查搜索接口；没关键字 → 查全部
            const url = kw
                ? '/note/search?keyword=' + encodeURIComponent(kw)
                : '/note/list';

            const notes = await api(url);
            render(notes);
        }, 300);
    });
</script>

</body>
</html>
