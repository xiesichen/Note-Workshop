<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的笔记 - 笔记工坊</title>
<style>
    body { font-family: sans-serif; margin: 0; background: #f5f5f5; }

    .header { background: #4a90d9; color: white; padding: 15px 30px;
        display: flex; justify-content: space-between; align-items: center; }
    .header h2 { margin: 0; font-size: 20px; }
    .header a { color: white; text-decoration: none; margin-left: 14px; }
    .header span { margin-left: 16px; }
    .header a:hover { text-decoration: underline; }

    .wrap { max-width: 800px; margin: 20px auto; }

    .bar { display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 14px; color: #666; font-size: 14px; }
    .bar a { padding: 7px 16px; background: #4a90d9; color: #fff;
        border-radius: 6px; text-decoration: none; font-size: 13px; }

    .card { background: #fff; border-radius: 8px; padding: 16px;
        margin-bottom: 14px; box-shadow: 0 2px 5px rgba(0,0,0,.08); }
    .card h3 { margin: 0 0 6px; font-size: 17px; cursor: pointer; }
    .card h3:hover { color: #4a90d9; }
    .meta { color: #999; font-size: 13px; margin-bottom: 8px; }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 3px;
        font-size: 12px; margin-left: 6px; vertical-align: middle; }
    .pub  { background: #e6f4ff; color: #1677ff; }
    .priv { background: #fff3e0; color: #e67e22; }
    .text { color: #444; font-size: 14px; line-height: 1.7;
        white-space: pre-wrap; word-break: break-word; }

    .acts { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f2f2f2; }
    .acts a, .acts button { padding: 5px 14px; border: none; border-radius: 5px;
        font-size: 13px; cursor: pointer; text-decoration: none; margin-right: 8px;
        font-family: inherit; display: inline-block; }
    .edit { background: #e6f4ff; color: #1677ff; }
    .del  { background: #ffe5e5; color: #e74c3c; }

    .pager { display: flex; justify-content: center; align-items: center;
        gap: 14px; margin: 24px 0 40px; font-size: 14px; color: #666; }
    .pager button { padding: 7px 18px; border: 1px solid #ddd; background: #fff;
        border-radius: 5px; cursor: pointer; font-size: 13px; }
    .pager button:disabled { color: #ccc; cursor: not-allowed; background: #fafafa; }

    .empty { text-align: center; color: #999; padding: 60px 0; font-size: 15px; }
</style>
</head>
<body>

<div class="header">
    <h2>📓 笔记工坊</h2>
    <div id="userArea">
        <a href="/">大厅</a>
    </div>
</div>

<div class="wrap">
    <div class="bar">
        <span id="summary">加载中...</span>
        <a href="/add.html">✏️ 写新笔记</a>
    </div>

    <div id="list"></div>
    <div class="pager" id="pager" style="display:none;">
        <button id="prev" onclick="go(1)">← 上一页</button>
        <span id="pageInfo"></span>
        <button id="next" onclick="go(-1)">下一页 →</button>
    </div>
</div>

<script src="/common.js"></script>

<script>
    // ==================== ① 登录校验 + 顶栏 ====================
    const me = requireLogin();           // 没登录会跳走

    if (me) {
        document.getElementById('userArea').innerHTML =
            '<a href="/">大厅</a>' +
            '<a href="/my.html">我的笔记</a>' +
            '<a href="/liked.html">我赞过的</a>' +
            '<span>欢迎，' + (me.nickname || me.username) + '</span>' +
            '<a href="javascript:void(0)" onclick="logout()">退出</a>';
    }

    // ==================== ② 分页状态 ====================
    let curPage = 1;
    const PAGE_SIZE = 5;                 // 每页 5 条，方便演示翻页

    // ==================== ③ 加载数据 ====================
    async function load() {
        let data;
        try {
            // api() 会自动带上 Authorization 头
            data = await api('/note/my?page=' + curPage + '&size=' + PAGE_SIZE);
        } catch (e) {
            document.getElementById('list').innerHTML =
                '<div class="empty">加载失败：' + e.message + '</div>';
            return;
        }

        const list = data.list || [];
        const total = data.total || 0;
        const pages = data.pages || 0;

        // 顶部统计
        document.getElementById('summary').textContent =
            '共 ' + total + ' 条笔记（含私有）';

        // 列表
        const box = document.getElementById('list');

        if (list.length === 0) {
            box.innerHTML = '<div class="empty">还没有笔记，点右上角「写新笔记」试试</div>';
            document.getElementById('pager').style.display = 'none';
            return;
        }

        box.innerHTML = list.map(n => {
            const badge = n.isPublic === 1
                ? '<span class="badge pub">公开</span>'
                : '<span class="badge priv">私有</span>';

            const t = n.createTime ? n.createTime.replace('T', ' ').slice(0, 16) : '';

            return `
                <div class="card">
                    <h3 onclick="location.href='/detail.html?id=${n.id}'">${n.title}${badge}</h3>
                    <div class="meta">📖 ${n.bookName || '（未填图书）'} · ${t}</div>
                    <div class="text">${n.content || '（没有内容）'}</div>
                    <div class="acts">
                        <a class="edit" href="/edit.html?id=${n.id}">编辑</a>
                        <button class="del" onclick="delNote(${n.id})">删除</button>
                    </div>
                </div>
            `;
        }).join('');

        // 分页控件
        const pager = document.getElementById('pager');
        if (pages > 1) {
            pager.style.display = 'flex';
            document.getElementById('pageInfo').textContent =
                '第 ' + data.page + ' / ' + pages + ' 页';
            document.getElementById('prev').disabled = (data.page <= 1);
            document.getElementById('next').disabled = (data.page >= pages);
        } else {
            pager.style.display = 'none';
        }
    }

    // ==================== ④ 翻页 ====================
    // dir = 1 表示上一页，-1 表示下一页
    function go(dir) {
        if (dir === 1 && curPage > 1) {
            curPage--;
            load();
            window.scrollTo(0, 0);
        } else if (dir === -1) {
            curPage++;
            load();
            window.scrollTo(0, 0);
        }
    }

    // ==================== ⑤ 删除 ====================
    async function delNote(id) {
        if (!confirm('确定删除这条笔记吗？')) return;

        try {
            await api('/note/delete?id=' + id, { method: 'DELETE' });
            alert('已删除');
            load();          // 重新加载当前页
        } catch (e) {
            alert('删除失败：' + e.message);
        }
    }

    // ==================== ⑥ 首次加载 ====================
    load();
</script>

</body>
</html>
